<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Drop</title>
  
  <!-- Tailwind CSS pour la mise en page rapide -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Effet de halo blanc autour du logo transparent */
    .halo-blanc {
      filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.4))
              drop-shadow(0 0 50px rgba(255, 255, 255, 0.15));
      transition: filter 0.4s ease, transform 0.4s ease;
    }

    /* Petit effet de brillance supplémentaire au survol (optionnel) */
    .halo-blanc:hover {
      transform: scale(1.02);
      filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.6))
              drop-shadow(0 0 70px rgba(255, 255, 255, 0.3));
    }
  </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-6 m-0 overflow-hidden select-none">

  <!-- Logo centré verticalement et horizontalement -->
  <div class="flex items-center justify-center">
    <img 
      src="big KEY DROP.png" 
      alt="Key Drop Logo" 
      class="halo-blanc w-64 sm:w-80 md:w-96 lg:w-[420px] h-auto object-contain"
    >
  </div>

</body>
</html>
